openapi: 3.0.3
info:
  title: Pet Store API
  version: 1.0.0
  description: |
    Sample Pet Store API used to demonstrate openapi-mcp-generator.
    Covers path, query, header params and JSON requestBody for MCP tool mapping.

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: http://localhost:3000
    description: Local dev

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      description: Get a paginated list of pets with optional filtering.
      parameters:
        - name: limit
          in: query
          description: Number of results to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter by pet status
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
        - name: X-Request-Id
          in: header
          description: Optional request correlation id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"

    post:
      operationId: createPet
      summary: Create a pet
      description: Create a new pet in the store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /pets/{petId}:
    get:
      summary: Get pet by ID
      description: Retrieve a single pet by its ID.
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of pet to fetch
          schema:
            type: string
        - name: include
          in: query
          description: Comma-separated related resources to include
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Single pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found

    put:
      operationId: updatePet
      summary: Update a pet
      description: Update an existing pet's information.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "200":
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

    delete:
      operationId: deletePet
      summary: Delete a pet
      description: Delete a pet by ID.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /pets/{petId}/photos:
    post:
      operationId: uploadPetPhoto
      summary: Upload a pet photo
      description: Upload a photo for a pet (demonstrates body + path param combo).
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of the photo
                caption:
                  type: string
                  description: Optional caption
      responses:
        "200":
          description: Photo uploaded

  /store/inventory:
    get:
      operationId: getInventory
      summary: Get inventory
      description: Returns pet inventories by status.
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer

components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Unique identifier
        name:
          type: string
          description: Pet name
        tag:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Pet name
        tag:
          type: string
          description: Optional tag
        status:
          type: string
          enum: [available, pending, sold]
          default: available
